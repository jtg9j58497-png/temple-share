<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temple Share — Prototype</title><style>
:root{--navy:#263b52;--blue:#416b83;--cream:#faf8f3;--gold:#ae8851;--line:#dddcd7;--muted:#63717a}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#263744;font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:16px max(20px,calc((100vw - 1080px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-family:Georgia,serif;font-size:27px;color:var(--navy);font-weight:bold}nav{display:flex;gap:8px;flex-wrap:wrap}button,.btn{font:inherit;cursor:pointer;border:1px solid var(--blue);border-radius:9px;background:var(--blue);color:#fff;padding:10px 17px}button.secondary{background:white;color:var(--blue)}button:disabled{cursor:not-allowed;opacity:.45}.navbtn{padding:7px 12px;background:white;color:var(--navy);border-color:transparent}.navbtn:hover{border-color:var(--line)}main{max-width:1080px;margin:auto;padding:24px 20px 60px}.hero{text-align:center;padding:58px 12px 32px}.hero h1{font-family:Georgia,serif;color:var(--navy);font-size:clamp(34px,5vw,56px);line-height:1.1;margin:0 0 16px}.tagline{color:#8a6c3f;letter-spacing:.04em;font-weight:650}.intro{max-width:690px;margin:22px auto;color:#526370;font-size:19px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:25px;box-shadow:0 4px 15px #1a28310a}.panel h2,.panel h3{font-family:Georgia,serif;color:var(--navy);margin:0 0 12px}.choice{padding:35px 28px;text-align:center}.choice .symbol{font-size:34px}.choice p{min-height:55px}.choice button{width:100%}.purpose{text-align:center;max-width:790px;margin:42px auto 15px;padding:22px;border-top:1px solid var(--line)}.purpose p{font-family:Georgia,serif;font-size:23px;color:var(--navy)}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:var(--gold);font-size:12px;font-weight:bold}.muted,.hint{color:var(--muted)}.hint{font-size:13px}label{display:block;font-weight:650;margin:15px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #bfc7ca;border-radius:8px;font:inherit;background:white;color:inherit}textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.pill{display:inline-block;border-radius:100px;padding:3px 11px;background:#edf2f3;color:#3e5d67;font-size:13px}.disabledrow{opacity:.5}.notice{background:#f2f5f6;border-left:4px solid #7895a2;padding:13px 16px;border-radius:6px;margin:17px 0}.success{background:#eff7f0;border-color:#7b9b7f}.cards{display:grid;gap:14px}.cardline{border:1px solid var(--line);border-radius:12px;padding:17px;background:#fff}.cardline h3{margin:0;font-family:Georgia,serif;color:var(--navy)}.meta{font-size:14px;color:var(--muted)}.cardline .actions{margin-top:12px}footer{text-align:center;color:var(--muted);padding:24px;border-top:1px solid var(--line);font-size:13px}.back{margin-bottom:18px}.small{font-size:13px}.sectiontitle{font-family:Georgia,serif;font-size:32px;color:var(--navy);margin:0 0 8px}.toggleline{display:flex;justify-content:space-between;gap:15px;align-items:center;border-top:1px solid var(--line);padding:18px 0}.check{width:auto;margin-right:8px}.hidden{display:none}.message{background:#f7f8f8;border-radius:10px;padding:12px 15px;margin:10px 0}.message strong{color:var(--navy)}@media(max-width:500px){.hero{padding-top:32px}.panel{padding:20px}.brand{font-size:24px}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tabs button{background:#fff;color:var(--navy);border-color:var(--line)}.tabs button.active{background:var(--navy);color:#fff}.mini{padding:7px 10px;font-size:13px}.split{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.method{border:1px solid var(--line);padding:14px;border-radius:10px;margin:8px 0}.status{font-size:13px;color:#536776}.locked{background:#f4f4f4;color:#777;border-color:#ccc}.fieldrow{display:flex;gap:8px;align-items:center}.fieldrow input{flex:1}a{color:var(--blue)}
</style></head><body><header><div class="brand">Temple Share</div><nav><button class="navbtn" title="Return to the home page" onclick="view('home')">Home</button><button class="navbtn" title="Share family ordinance opportunities" onclick="view('share')">I'd Like to Share</button><button class="navbtn" title="Find an ordinance to serve" onclick="view('serve')">I'd Like to Serve</button><button class="navbtn" title="Manage your shared names" onclick="view('activity')">My Shared Names</button><button class="navbtn" title="View your claimed ordinances" onclick="view('service')">My Temple Service</button><button class="navbtn" title="Manage profile and demo backups" onclick="view('settings')">Settings</button></nav></header><main id="app"></main><footer>Share a Name. Bless a Family. Turn Hearts.<br>Independent concept prototype • Not affiliated with or endorsed by FamilySearch or The Church of Jesus Christ of Latter-day Saints • No real ordinance cards are transmitted.</footer><script>
const K='temple-share-demo-v1';let data;try{data=JSON.parse(localStorage.getItem(K))}catch(e){};data=data||{profile:{name:'',email:'',ward:'',stake:''},cards:[],messages:{},seq:1};let current='home';let selectedId=null;let pageHistory=[];function save(){localStorage.setItem(K,JSON.stringify(data))}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function node(s){document.getElementById('app').innerHTML=s;window.scrollTo(0,0)}function view(s,id){if(s!==current)pageHistory.push({page:current,id:selectedId});current=s;selectedId=id??null;render()}function back(){const prev=pageHistory.pop();current=prev?.page||'home';selectedId=prev?.id??null;render()}function intro(){return `<div class="notice"><strong>Interactive demonstration.</strong> Data is stored only in this browser and may not persist across different local HTML files. Use Settings → Download Backup to protect your test entries. No live accounts, uploaded files, emails, FamilySearch checks, or server-side locks are active. Use fictional ancestor details only.</div>`}function render(){if(current==='home')return home();if(current==='share')return share();if(current==='serve')return serve();if(current==='activity')return activity();if(current==='detail')return detail();if(current==='settings')return settings();if(current==='profile')return profile()}
function home(){node(`<section class="hero"><div class="eyebrow">A modern temple credenza</div><h1>Share a Name.<br>Bless a Family.<br>Turn Hearts.</h1><p class="intro">Connecting people who have family temple ordinance opportunities with those willing to serve, one family at a time.</p></section><section class="grid"><div class="panel choice"><div class="symbol">♡</div><h2>I'd Like to Share</h2><p>I have family names that need temple ordinances, and I'd like someone to help.</p><button onclick="view('share')">Share Family Names</button></div><div class="panel choice"><div class="symbol">✦</div><h2>I'd Like to Serve</h2><p>Find a family name shared by someone in my ward or stake.</p><button onclick="view('serve')">Find an Opportunity</button></div></section><section class="purpose"><div class="eyebrow">Our Purpose</div><p>Temple Share isn't just about completing ordinances. It's about bringing people together through sacred service.</p><span class="muted">Inspired by the spirit of the temple credenzas of years past.</span></section>${intro()}`)}
function profile(){let p=data.profile;node(`<button class="secondary back" onclick="back()">← Back</button><h1 class="sectiontitle">Your Temple Share Profile</h1><p class="muted">A simple sign-up preview. Email verification will be added with the real server.</p><div class="panel"><form onsubmit="updateProfile(event)"><label>Your name</label><input name="name" required value="${esc(p.name)}"><label>Email address</label><input name="email" type="email" required value="${esc(p.email)}"><label>Ward</label><input name="ward" required value="${esc(p.ward)}"><label>Stake</label><input name="stake" required value="${esc(p.stake)}"><div class="actions"><button>Save Profile</button></div></form></div>`)}function updateProfile(e){e.preventDefault();const f=new FormData(e.target);for(let k of ['name','email','ward','stake'])data.profile[k]=f.get(k).trim();save();view('home')}
function share(){node(`<button class="secondary back" onclick="back()">← Back</button><h1 class="sectiontitle">I'd Like to Share</h1><p class="muted">Three simple steps to share family ordinance opportunities.</p><div class="panel"><form id="sharewizard" onsubmit="addCard(event)"><div id="share-step-1"><p><strong>Step 1 of 3 — Add your ordinance cards</strong></p><label>Who are you sharing for?</label><select name="onbehalf" id="onbehalf" onchange="document.getElementById('helper').classList.toggle('hidden',this.value!=='helper')"><option value="self">I'm sharing my own family names</option><option value="helper">I'm helping someone else</option></select><div id="helper" class="hidden"><label>Name of person you're helping</label><input name="owner"><label><input class="check" type="checkbox" name="permission">I have their permission to share these names</label></div><label>Ancestor names (one per line)</label><textarea name="ancestors" required rows="4" placeholder="Elizabeth Williams&#10;John Williams"></textarea><p class="hint">For this demonstration, enter fictional names. Each line becomes a separate opportunity.</p><label>Ordinance type for these names</label><select name="ordinance"><option>Baptism and Confirmation</option><option>Initiatory</option><option>Endowment</option><option>Sealing to Spouse</option><option>Sealing to Parents</option></select><label>Ordinance cards (demo only)</label><input type="file" accept=".pdf,image/*" name="cardfile" multiple><p class="hint">Files are not uploaded or stored in this prototype. Do not use actual ordinance cards. A live version will need secure card handling and ordinance-level tracking.</p><div class="actions"><button type="button" onclick="shareStep(2)">Continue →</button></div></div><div id="share-step-2" class="hidden"><p><strong>Step 2 of 3 — Choose who can see them</strong></p><p class="hint">Your current ward and stake are taken from your profile. <a href="#" onclick="event.preventDefault();alert('To change your ward or stake, save this information and update your profile from Settings.')">About affiliations</a></p><label>Who may accept these names?</label><select name="audience"><option value="ward">My Ward (default)</option><option value="stake">My Stake</option><option value="family">A specific family (future invitation)</option><option value="person">A specific person (future invitation)</option></select><p class="hint">Ward sharing reaches your ward only. Stake sharing reaches members throughout your stake, including your ward.</p><p class="hint">Ward and stake affiliations are self-reported, not verified membership directories.</p><label>Optional message to the volunteer</label><textarea name="note" placeholder="This was my grandmother, and it would mean so much to our family..."></textarea><div class="actions"><button type="button" class="secondary" onclick="shareStep(1)">← Back</button><button type="button" onclick="shareStep(3)">Review →</button></div></div><div id="share-step-3" class="hidden"><p><strong>Step 3 of 3 — Review and share</strong></p><div id="share-review" class="cardline"></div><p class="hint">Demo only: names are saved in this browser. No actual ordinance cards are distributed.</p><div class="actions"><button type="button" class="secondary" onclick="shareStep(2)">← Back</button><button type="submit">Share Opportunities</button></div></div></form></div>${intro()}`)}
function shareStep(n){let form=document.getElementById('sharewizard');let f=new FormData(form);let names=String(f.get('ancestors')||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(n>1){if(!names.length)return alert('Please enter at least one fictional ancestor name.');if(f.get('onbehalf')==='helper'&&(!f.get('permission')||!String(f.get('owner')||'').trim()))return alert('Please provide the name of the person you are helping and confirm permission.')}if(n===3){document.getElementById('share-review').innerHTML='<strong>'+names.length+' ordinance opportunity'+(names.length===1?'':'ies')+'</strong><p>'+names.map(esc).join('<br>')+'</p><p>'+esc(f.get('ordinance'))+' · '+esc(f.get('audience'))+'</p>'+(f.get('note')?'<p>Message: '+esc(f.get('note'))+'</p>':'')}for(let i=1;i<=3;i++)document.getElementById('share-step-'+i).classList.toggle('hidden',i!==n)}
function addCard(e){e.preventDefault();let f=new FormData(e.target);let names=String(f.get('ancestors')||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!names.length)return;if(!data.profile.ward.trim()||!data.profile.stake.trim())return alert('Please set your ward and stake under Settings → Edit Profile before sharing.');for(let ancestor of names){let c={id:data.seq++,ancestor,ordinance:f.get('ordinance'),audience:f.get('audience'),owner:f.get('onbehalf')==='helper'?f.get('owner').trim():'Me',note:f.get('note').trim(),ward:data.profile.ward.trim(),stake:data.profile.stake.trim(),file:'',status:'available',volunteer:'',reported:false,verified:false,created:new Date().toLocaleDateString()};data.cards.push(c)}save();view('activity')}
function cardHTML(c,mode){let st=c.status==='available'?'Available':c.status==='claimed'?'Claimed':c.status==='completed'?'Reported complete':'Completed';return `<div class="cardline"><h3>${esc(c.ancestor)}</h3><div class="meta">${esc(c.ordinance)} · ${esc(c.audience)} · <span class="pill">${st}</span></div>${c.note?`<p>${esc(c.note)}</p>`:''}<div class="actions"><button class="secondary" onclick="view('detail',${c.id})">View Details</button>${mode==='serve'&&c.status==='available'?`<button onclick="claim(${c.id})">Claim This Ordinance</button>`:''}</div></div>`}
function serve(){node(`<button class="secondary back" onclick="back()">← Back</button><h1 class="sectiontitle">I'd Like to Serve</h1><p class="muted">Choose whether to serve someone in your ward or throughout your stake.</p><div class="panel" style="margin-bottom:20px"><label>Find names shared with</label><select id="area" onchange="renderServeList()"><option value="ward">My Ward (default)</option><option value="stake">My Stake</option></select><label>Choose an ordinance type</label><select id="filter" onchange="renderServeList()"><option value="all">All ordinance types</option>${['Baptism and Confirmation','Initiatory','Endowment','Sealing to Spouse','Sealing to Parents'].map(x=>`<option>${x}</option>`).join('')}</select><p class="hint">My Stake includes ward and stake-wide opportunities within your stake. Ward-only names from other wards are never included.</p><p class="hint">Your ward and stake come from your <a href="#" onclick="event.preventDefault();view('profile')">profile</a>.</p></div><div id="servlist" class="cards"></div>${intro()}`);renderServeList()}
function renderServeList(){let f=document.getElementById('filter').value,area=document.getElementById('area').value,p=data.profile;let target=document.getElementById('servlist');if(!p.ward.trim()||!p.stake.trim()){target.innerHTML='<div class="panel">To see ward and stake opportunities, first enter your ward and stake in your <a href="#" onclick="event.preventDefault();view(\'profile\')">profile</a>.</div>';return}let norm=x=>String(x||'').trim().toLowerCase();let cards=data.cards.filter(c=>{if(c.status!=='available'||(f!=='all'&&c.ordinance!==f))return false;if(!c.ward||!c.stake)return false;let sameStake=norm(c.stake)===norm(p.stake),sameWard=norm(c.ward)===norm(p.ward)&&sameStake;if(area==='ward')return sameWard&&(c.audience==='ward'||c.audience==='stake');return sameStake&&(c.audience==='stake'||(c.audience==='ward'&&sameWard))});cards.sort((a,b)=>{let aWard=norm(a.ward)===norm(p.ward)?0:1,bWard=norm(b.ward)===norm(p.ward)?0:1;return aWard-bWard});target.innerHTML=cards.length?cards.map(c=>cardHTML(c,'serve')).join(''):`<div class="panel">No matching opportunities in ${area==='ward'?'your ward':'your stake'} yet. Try sharing a fictional opportunity using the same ward and stake as your profile.</div>`}
function claim(id){let c=data.cards.find(x=>x.id===id);if(!c||c.status!=='available')return alert('This ordinance is no longer available.');if(!confirm(`Claim the ${c.ordinance} ordinance for ${c.ancestor}?`))return;c.status='claimed';c.volunteer=data.profile.name||'Demo Volunteer';save();view('detail',id)}
function activity(){node(`<button class="secondary back" onclick="back()">← Back</button><h1 class="sectiontitle">My Activity</h1><p class="muted">Track the opportunities you've shared or accepted.</p><div class="actions" style="margin-bottom:20px"><button onclick="view('share')">Share Another Name</button><button class="secondary" onclick="view('serve')">Find an Opportunity</button></div><div class="cards">${data.cards.length?data.cards.map(c=>cardHTML(c,'activity')).join(''):'<div class="panel">No activity yet. Share a fictional ordinance opportunity to try the prototype.</div>'}</div>`)}
function detail(){let c=data.cards.find(x=>x.id===selectedId);if(!c)return view('activity');let msgs=data.messages[c.id]||[];node(`<button class="secondary back" onclick="view('activity')">← My Activity</button><h1 class="sectiontitle">${esc(c.ancestor)}</h1><div class="grid"><div class="panel"><h2>Ordinance Opportunity</h2><p><strong>Ordinance:</strong> ${esc(c.ordinance)}<br><strong>Sharing:</strong> ${esc(c.audience)}<br><strong>Status:</strong> <span class="pill">${esc(c.status)}</span><br><strong>Volunteer:</strong> ${esc(c.volunteer||'Not yet claimed')}</p>${c.file?`<p class="hint">Selected file: ${esc(c.file)} (not uploaded)</p>`:''}${c.note?`<p><strong>Message:</strong> ${esc(c.note)}</p>`:''}${c.status==='available'?`<button onclick="claim(${c.id})">Claim This Ordinance</button>`:''}${c.status==='claimed'?`<div class="notice">The card is reserved for one volunteer in this demo. A production server must enforce this with an atomic database operation.</div><button onclick="report(${c.id})">I've Completed This Ordinance</button> <button class="secondary" onclick="release(${c.id})">Return Opportunity</button>`:''}${c.status==='completed'?`<div class="notice success">Completion was reported by the volunteer, not verified by FamilySearch.</div>`:''}</div><div class="panel"><h2>Circle of Gratitude</h2><p class="muted">A private space to share appreciation or a meaningful experience. Messages are optional.</p>${msgs.length?msgs.map(m=>`<div class="message"><strong>${esc(m.author)}${m.role?' · '+esc(m.role):''}</strong>${m.at?`<div class="hint">${esc(new Date(m.at).toLocaleString())}</div>`:''}<div>${esc(m.body)}</div></div>`).join(''):'<p class="hint">No messages yet.</p>'}<form onsubmit="message(event,${c.id})"><label>Write a personal message (optional)</label><textarea name="body" placeholder="It was a privilege to perform this ordinance..." required></textarea><div class="actions"><button>Post Message</button></div></form><p class="hint">Demo messages remain in this browser only. Real messages will be private and protected by server-side permissions.</p></div></div>`)}function report(id){let c=data.cards.find(x=>x.id===id);if(!c||c.status!=='claimed')return;if(!confirm('Are you sure this ordinance has been completed? This will mark it as reported, not FamilySearch-verified.'))return;c.status='completed';c.reported=true;save();view('detail',id)}function release(id){let c=data.cards.find(x=>x.id===id);if(!c||c.status!=='claimed')return;if(!confirm('Return this opportunity to the available list? In the live site, FamilySearch status must be checked before reassignment.'))return;c.status='available';c.volunteer='';save();view('detail',id)}function message(e,id){e.preventDefault();let body=new FormData(e.target).get('body').trim();if(!body)return;data.messages[id]??=[];data.messages[id].push({author:data.profile.name||'Demo Participant',role:pageHistory.at(-1)?.page==='activity'?'Contributor':'Volunteer',at:new Date().toISOString(),body});save();view('detail',id)}
function settings(){node(`<button class="secondary back" onclick="back()">← Back</button><h1 class="sectiontitle">Completion Verification</h1><p class="muted">Administrator settings — design preview</p><div class="panel"><div class="toggleline" style="border:0"><div><strong>✓ Manual Completion Reporting</strong><p class="muted small">Volunteers can report an ordinance as completed. The contributor is notified that completion has been reported.</p><span class="pill">Enabled in prototype</span></div><input class="check" type="checkbox" checked disabled aria-label="Manual completion reporting enabled"></div><div class="toggleline disabledrow"><div><strong>🔒 Automatic FamilySearch Verification</strong><p class="muted small">Periodically checks ordinance completion status through an approved FamilySearch connection.</p><span class="pill">Awaiting FamilySearch authorization</span></div><input class="check" type="checkbox" disabled aria-label="Automatic verification disabled"></div></div><div class="panel" style="margin-top:20px"><h2>Profile &amp; Demo Tools</h2><div class="actions"><button onclick="view('profile')">Edit Profile</button><button class="secondary" onclick="exportDemo()">Download Backup</button><button class="secondary" onclick="document.getElementById('importDemoFile').click()">Restore Backup</button><input id="importDemoFile" type="file" accept=".json,application/json" style="display:none" onchange="importDemo(event)"><span class="hint">Keep the downloaded backup file. Browser-only storage can be lost or inaccessible when opening different HTML versions.</span><button class="secondary" onclick="resetDemo()">Reset Demo Data</button></div></div>${intro()}`)}function exportDemo(){
 const payload={format:'temple-share-demo-backup',version:1,exportedAt:new Date().toISOString(),data:data};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='temple-share-demo-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function importDemo(event){
 const file=event.target.files&&event.target.files[0];event.target.value='';if(!file)return;
 let payload;try{payload=JSON.parse(await file.text())}catch(e){alert('This is not a readable JSON backup.');return}
 if(payload?.format!=='temple-share-demo-backup'||payload.version!==1||!payload.data||!Array.isArray(payload.data.cards)||typeof payload.data.profile!=='object'||!payload.data.profile||typeof payload.data.messages!=='object'||!payload.data.messages){alert('This file is not a valid Temple Share demo backup.');return}
 const newData=payload.data;
 if(!Number.isFinite(newData.seq))newData.seq=Math.max(0,...newData.cards.map(c=>Number(c.id)||0))+1;
 if(data.cards.length){const ok=confirm('Restoring this backup replaces the '+data.cards.length+' names currently visible in this browser. Download a backup of the current names first. Continue?');if(!ok)return}
 try{localStorage.setItem(K,JSON.stringify(newData))}catch(e){alert('Safari could not save the restored data. Please check browser storage settings.');return}
 data=newData;pageHistory=[];current='activity';selectedId=null;render();alert('Backup restored: '+data.cards.length+' saved ordinance opportunities.');
}
function resetDemo(){if(confirm('Erase all demo opportunities and messages from this browser?')){localStorage.removeItem(K);data={profile:{name:'',email:'',ward:'',stake:''},cards:[],messages:{},seq:1};view('home')}}
// Version 4 demonstration: sharing methods, dashboards, invitations, and optional gratitude.
let dashboardFilter='all',serviceFilter='all',serveScope='ward',serveType='all',serveSearch='',serveQuantity=1;
function ensureV4(){data.cards.forEach(c=>{c.method??='upload';c.priority??=c.id;c.claimedAt??='';c.volunteerEmail??='';c.invitationStatus??='';c.invitationSent??=false;c.invitationAccepted??=false;c.contactConsent??=false;c.returnPending??=false});data.profile.name??=''}
function render(){ensureV4();if(current==='home')return home();if(current==='share')return shareV4();if(current==='serve')return serveV4();if(current==='activity')return activityV4();if(current==='service')return serviceV4();if(current==='detail')return detailV4();if(current==='settings')return settings();if(current==='profile')return profile();if(current==='review')return reviewV4();if(current==='edit')return editOpportunityScreen()}
let pendingBatch=[];let editingGroupIndex=null;
function readShareEntry(){const form=document.getElementById('v4share');const f=new FormData(form);return {names:String(f.get('ancestors')||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean),ordinance:String(f.get('ordinance')),method:String(f.get('method')),audience:String(f.get('audience')),note:String(f.get('note')||'').trim(),file:f.get('pdf')?.name||''}}
function shareV4(){node(`<button class="secondary back" onclick="back()">← Back</button><h1 class="sectiontitle">I'd Like to Share</h1><p class="muted">Add one or many family names. Review everything together before sharing.</p><div class="panel"><form id="v4share" onsubmit="submitV4(event)"><h2>1. How would you like to share?</h2><div class="method"><label><input class="check" type="radio" name="method" value="upload" checked onchange="methodChange()"> Upload My Ordinance Card</label><p class="hint">Save your card as a PDF from FamilySearch and add it here.</p></div><div class="method"><label><input class="check" type="radio" name="method" value="familysearch" onchange="methodChange()"> Share Through FamilySearch</label><p class="hint">After someone claims it, send an individual-sharing invitation through FamilySearch.</p></div><div id="uploadGuide"><label>Choose sample ordinance-card files (optional in demo)</label><input type="file" name="pdf" accept=".pdf,image/*" multiple><details><summary>How do I save a card from FamilySearch?</summary><ol><li>Open your ancestor's Ordinances tab.</li><li>Choose Print → Print Family Name Cards.</li><li>Select ordinances and click Print.</li><li>Continue to the printable document and use Save as PDF.</li><li>Return here and select the saved PDF.</li></ol><p class="hint">Confirm the card is current and the ordinances are still available.</p></details><p class="hint">Files are not uploaded or stored in this demo. Use fictional names only.</p></div><h2>2. Which family names?</h2><label>Ancestor names (one per line)</label><textarea name="ancestors" placeholder="Elizabeth Williams&#10;Thomas Bennett"></textarea><label>Ordinance type for these names</label><select name="ordinance">${['Baptism and Confirmation','Initiatory','Endowment','Sealing to Spouse','Sealing to Parents'].map(o=>`<option>${o}</option>`).join('')}</select><p class="hint">Add names with a different ordinance type in another group. Each ordinance is tracked separately.</p><h2>3. Who can see these names?</h2><select name="audience"><option value="ward">My Ward</option><option value="stake">My Stake</option><option value="person">Personal Invitation</option><option value="family">Family Invitation</option></select><p class="hint">Your ward is the default. Personal and family invitations can reach people outside your stake.</p><label>Optional message to volunteers</label><textarea name="note" placeholder="This was my grandmother. Thank you for helping our family."></textarea><div class="actions"><button type="button" class="secondary" onclick="queueShareEntry()">+ Save Group & Continue</button></div></form></div><div id="pendingList"></div><div class="panel" style="margin-top:18px"><div class="actions"><button type="button" onclick="submitV4(event)">Review and Share →</button></div><p class="hint">When you have finished adding names, click here to review them before sharing.</p></div>${intro()}`);restoreShareDraft();renderPendingList()}
function restoreShareDraft(){if(!draftV4)return;const f=document.getElementById('v4share');if(!f)return;f.elements.ancestors.value=draftV4.names.join('\n');f.elements.ordinance.value=draftV4.ordinance;f.elements.audience.value=draftV4.audience;f.elements.note.value=draftV4.note||'';const r=f.querySelector('input[name="method"][value="'+draftV4.method+'"]');if(r)r.checked=true;methodChange()}
function methodChange(){const el=document.getElementById('uploadGuide');if(el)el.classList.toggle('hidden',document.querySelector('input[name=method]:checked').value!=='upload')}
let draftV4=null;
function queueShareEntry(){const d=readShareEntry();if(!d.names.length)return alert('Enter at least one fictional ancestor name first.');if(editingGroupIndex!==null){pendingBatch.splice(editingGroupIndex,0,d);editingGroupIndex=null}else pendingBatch.push(d);draftV4=null;document.getElementById('v4share').reset();methodChange();renderPendingList();document.querySelector('[name="ancestors"]').focus()}
function renderPendingList(){const el=document.getElementById('pendingList');if(!el)return;const total=pendingBatch.reduce((n,d)=>n+d.names.length,0);el.innerHTML=pendingBatch.length?`<div class="panel" style="margin-top:18px"><h2>Names Ready for Review (${total})</h2><p class="hint">These are saved in your current draft, not yet shared.</p>${pendingBatch.map((d,i)=>`<div class="cardline"><strong>Group ${i+1} · ${d.names.length} name${d.names.length===1?'':'s'}</strong><p>${d.names.map(esc).join('<br>')}</p><div class="meta">${esc(d.ordinance)} · ${audienceName(d.audience)} · ${d.method==='upload'?'Upload':'FamilySearch'}</div><div class="actions"><button class="secondary mini" type="button" onclick="editPending(${i})">Edit Group</button><button class="secondary mini" type="button" onclick="removePending(${i})">Remove Group</button><span id="pending-remove-${i}"></span></div></div>`).join('')}</div>`:''}
function editPending(i){if(i<0||i>=pendingBatch.length)return;const currentNames=String(document.querySelector('#v4share [name=ancestors]')?.value||'').trim();if(currentNames&&!confirm('Replace the names currently entered with this saved group?'))return;if(editingGroupIndex!==null){alert('Finish editing the current group by clicking Add These Names & Continue first.');return}editingGroupIndex=i;draftV4=pendingBatch.splice(i,1)[0];shareV4();document.querySelector('#v4share [name=ancestors]')?.focus()}
function removePending(i){
 if(i<0||i>=pendingBatch.length)return;
 const host=document.getElementById('pending-remove-'+i);if(!host)return;
 host.innerHTML=`<span class="muted">Remove this group?</span> <button type="button" class="mini" onclick="confirmRemovePending(${i})">Yes, Remove</button> <button type="button" class="secondary mini" onclick="removePendingCancel(${i})">Cancel</button>`;
}
function removePendingCancel(i){const host=document.getElementById('pending-remove-'+i);if(host)host.innerHTML=''}
function confirmRemovePending(i){if(i<0||i>=pendingBatch.length)return;pendingBatch.splice(i,1);if(editingGroupIndex!==null){if(i<editingGroupIndex)editingGroupIndex--;else if(i===editingGroupIndex)editingGroupIndex=null;}renderPendingList()}
function submitV4(e){if(e)e.preventDefault();const d=readShareEntry();const all=[...pendingBatch];if(d.names.length)all.push(d);if(!all.length)return alert('Please enter at least one fictional ancestor name.');draftV4=d.names.length?d:null;view('review')}
function reviewV4(){const d=draftV4;const all=[...pendingBatch,...(d&&d.names.length?[d]:[])];if(!all.length)return view('share');const count=all.reduce((n,g)=>n+g.names.length,0);node(`<button class="secondary back" onclick="back()">← Back to Add Names</button><h1 class="sectiontitle">Step 2 of 3 — Review Your Names</h1><p class="muted"><strong>Not shared yet.</strong> Check all ${count} ordinance opportunities. Nothing will be published until you confirm below.</p><div class="panel">${all.map((g,i)=>`<div class="cardline"><h3>Group ${i+1}</h3><p>${g.names.map(esc).join('<br>')}</p><p><strong>Ordinance:</strong> ${esc(g.ordinance)}<br><strong>Method:</strong> ${g.method==='upload'?'Upload card':'FamilySearch invitation'}<br><strong>Audience:</strong> ${audienceName(g.audience)}</p>${g.note?`<p><strong>Message:</strong> ${esc(g.note)}</p>`:''}<div class="actions"><button class="secondary mini" onclick="editReviewGroup(${i})">Edit</button><button class="secondary mini" onclick="removeReviewGroup(${i})">Remove Group</button><span id="review-remove-${i}"></span></div></div>`).join('')}<div class="notice">Demonstration only. No card files or invitations are sent.</div><div class="actions"><button class="secondary" onclick="back()">← Add More Names</button><button type="button" onclick="showFinalShareConfirmation()">Continue to Final Confirmation →</button></div></div>`)}
function editReviewGroup(i){const all=[...pendingBatch,...(draftV4&&draftV4.names.length?[draftV4]:[])];if(i<0||i>=all.length)return;draftV4=all[i];pendingBatch=all.filter((_,j)=>j!==i);editingGroupIndex=pendingBatch.length;view('share')}
function removeReviewGroup(i){
 const all=[...pendingBatch,...(draftV4&&draftV4.names.length?[draftV4]:[])];if(i<0||i>=all.length)return;
 const host=document.getElementById('review-remove-'+i);if(!host)return;
 host.innerHTML=`<span class="muted">Remove this group?</span> <button type="button" class="mini" onclick="confirmRemoveReviewGroup(${i})">Yes, Remove</button> <button type="button" class="secondary mini" onclick="removeReviewGroupCancel(${i})">Cancel</button>`;
}
function removeReviewGroupCancel(i){const host=document.getElementById('review-remove-'+i);if(host)host.innerHTML=''}
function confirmRemoveReviewGroup(i){const all=[...pendingBatch,...(draftV4&&draftV4.names.length?[draftV4]:[])];if(i<0||i>=all.length)return;all.splice(i,1);pendingBatch=all;draftV4=null;editingGroupIndex=null;if(!all.length)view('share');else reviewV4()}
function showFinalShareConfirmation(){const all=[...pendingBatch,...(draftV4&&draftV4.names.length?[draftV4]:[])];if(!all.length)return view('share');const count=all.reduce((n,g)=>n+g.names.length,0);node(`<button type="button" class="secondary back" onclick="view('review')">← Back to Review</button><h1 class="sectiontitle">Step 3 of 3 — Confirm Sharing</h1><div class="panel"><h2>Ready to share ${count} name${count===1?'':'s'}?</h2><p>These names have <strong>not yet been shared</strong>. Selecting the button below will add them to My Shared Names as Available.</p><label style="display:flex;gap:10px;align-items:center"><input id="confirmPublish" type="checkbox" style="width:auto"> I have reviewed these names and am ready to share them.</label><div class="actions"><button type="button" class="secondary" onclick="view('review')">← Back to Review</button><button type="button" onclick="publishConfirmed()">Share All ${count} Opportunities</button></div><p id="confirmHint" class="hint" role="status"></p></div>`)}
function publishConfirmed(){if(!document.getElementById('confirmPublish')?.checked){document.getElementById('confirmHint').textContent='Please check the confirmation box before sharing.';return;}commitV4()}
function commitV4(){const all=[...pendingBatch,...(draftV4&&draftV4.names.length?[draftV4]:[])];if(!all.length)return;for(const d of all)for(const ancestor of d.names)data.cards.push({id:data.seq++,ancestor,ordinance:d.ordinance,method:d.method,audience:d.audience,owner:'Me',note:d.note,ward:data.profile.ward,stake:data.profile.stake,file:d.file,status:'available',volunteer:'',reported:false,verified:false,priority:data.seq,created:new Date().toLocaleDateString(),claimedAt:'',volunteerEmail:'',invitationSent:false,returnPending:false});draftV4=null;pendingBatch=[];editingGroupIndex=null;save();view('activity')}
function audienceName(a){return ({ward:'My Ward',stake:'My Stake',person:'Personal Invitation',family:'Family Invitation'})[a]||a}
function statusName(c){return c.returnPending?'Return pending review':c.status==='available'?'Available':c.status==='claimed'?(c.method==='familysearch'&&!c.invitationAccepted?(c.invitationSent?'Invitation Sent — Awaiting Acceptance':'Awaiting invitation'):'Ready to Perform'):c.verified?'FamilySearch verified':'Reported complete'}
function activityV4(){let cards=[...data.cards].sort((a,b)=>a.priority-b.priority),n={available:cards.filter(c=>c.status==='available').length,claimed:cards.filter(c=>c.status==='claimed').length,completed:cards.filter(c=>c.status==='completed').length};node(`<button class="secondary back" onclick="back()">← Back</button><h1 class="sectiontitle">My Shared Names</h1><p class="muted">See your available, claimed, and completed ordinances on one page.</p><div class="tabs">${[['all','All ('+cards.length+')'],['available','Available ('+n.available+')'],['claimed','Claimed ('+n.claimed+')'],['completed','Completed ('+n.completed+')']].map(([k,l])=>`<button class="mini ${dashboardFilter===k?'active':''}" onclick="dashboardFilter='${k}';activityV4()">${l}</button>`).join('')}</div><div class="panel" style="margin-bottom:18px"><h3>Invite Someone to Help</h3><p class="hint">Share your personal link, or ask someone to search for your name in Temple Share.</p><div class="actions"><button class="secondary" onclick="copyDemoLink()">Copy My Sharing Link</button><button class="secondary" onclick="emailDemoLink()">Send by Email</button></div><p class="hint">In this local demo, the link is illustrative only. Live links will be unique, access-controlled, and revocable.</p><div id="inviteFeedback" class="notice" style="display:none;margin-top:16px" aria-live="polite"></div></div><div class="actions" style="margin-bottom:16px"><button onclick="view('share')">+ Add Family Names</button><button class="secondary" onclick="view('service')">My Temple Service</button></div><p class="hint">Use ↑ ↓ to prioritize available opportunities. Claimed and completed assignments stay unchanged.</p><div class="cards">${cards.filter(c=>dashboardFilter==='all'||c.status===dashboardFilter).map(c=>`<div class="cardline"><div class="split"><div><h3>${esc(c.ancestor)}</h3><div class="meta">${esc(c.ordinance)} · ${audienceName(c.audience)} · ${c.method==='upload'?'Uploaded card':'FamilySearch sharing'}</div></div><span class="pill">${statusName(c)}</span></div><div class="actions">${c.status==='available'?`<button class="secondary mini" onclick="movePriority(${c.id},-1)">↑</button><button class="secondary mini" onclick="movePriority(${c.id},1)">↓</button>`:''}<button class="secondary mini" onclick="view('detail',${c.id})">Details & Messages</button>${c.status==='available'?`<button class="secondary mini" onclick="editOpportunity(${c.id})">Edit</button><button class="secondary mini" onclick="deleteOpportunity(${c.id})">Delete</button>`:''}</div><div id="delete-confirm-${c.id}" class="notice" style="display:none;margin-top:12px" aria-live="polite"></div></div>`).join('')||'<div class="panel">No opportunities in this category yet.</div>'}</div>${intro()}`)}

function editOpportunity(id){
 const c=data.cards.find(x=>x.id===id);if(!c||c.status!=='available')return;
 selectedId=id;current='edit';render();
}
function editOpportunityScreen(){
 const c=data.cards.find(x=>x.id===selectedId);if(!c||c.status!=='available'){view('activity');return;}
 node(`<button class="secondary back" onclick="view('activity')">← Back to My Shared Names</button><h1 class="sectiontitle">Edit Family Name</h1><div class="panel"><form onsubmit="saveOpportunityEdit(event,${c.id})"><label>Ancestor name</label><input name="ancestor" required value="${esc(c.ancestor)}"><label>Ordinance</label><select name="ordinance">${['Baptism and Confirmation','Initiatory','Endowment','Sealing to Spouse','Sealing to Parents'].map(o=>`<option ${c.ordinance===o?'selected':''}>${o}</option>`).join('')}</select><label>Sharing method</label><select name="method"><option value="upload" ${c.method==='upload'?'selected':''}>Upload My Ordinance Card</option><option value="familysearch" ${c.method==='familysearch'?'selected':''}>Share Through FamilySearch</option></select><label>Who may see this opportunity?</label><select name="audience">${['ward','stake','person','family'].map(a=>`<option value="${a}" ${c.audience===a?'selected':''}>${audienceName(a)}</option>`).join('')}</select><label>Optional message to volunteer</label><textarea name="note">${esc(c.note||'')}</textarea><p class="hint">Demo only: changing the sharing method does not upload a new card. For the live site, replacing a card will require a new file.</p><div class="actions"><button type="submit">Save Changes</button><button type="button" class="secondary" onclick="view('activity')">Cancel</button></div></form></div>${intro()}`);
}
function saveOpportunityEdit(e,id){e.preventDefault();const c=data.cards.find(x=>x.id===id);if(!c||c.status!=='available'){alert('Only available opportunities can be edited.');return;}const f=new FormData(e.target);const name=String(f.get('ancestor')||'').trim();if(!name)return;c.ancestor=name;c.ordinance=String(f.get('ordinance'));c.method=String(f.get('method'));c.audience=String(f.get('audience'));c.note=String(f.get('note')||'').trim();save();view('activity')}
function deleteOpportunity(id){
 const c=data.cards.find(x=>x.id===id);
 if(!c||c.status!=='available')return;
 const host=document.getElementById('delete-confirm-'+id);
 if(!host)return;
 host.style.display='block';
 host.innerHTML='<p><strong>Delete '+esc(c.ancestor)+'?</strong> This removes this available listing from the demo.</p><div class="actions"><button class="mini" onclick="confirmDeleteOpportunity('+id+')">Yes, Delete</button><button class="secondary mini" onclick="cancelDeleteOpportunity('+id+')">Cancel</button></div>';
}
function cancelDeleteOpportunity(id){const host=document.getElementById('delete-confirm-'+id);if(host){host.style.display='none';host.innerHTML='';}}
function confirmDeleteOpportunity(id){
 const c=data.cards.find(x=>x.id===id);
 if(!c||c.status!=='available')return;
 data.cards=data.cards.filter(x=>x.id!==id);
 delete data.messages[id];
 save();activityV4();
}

function movePriority(id,dir){let a=data.cards.filter(c=>c.status==='available').sort((x,y)=>x.priority-y.priority),i=a.findIndex(x=>x.id===id),j=i+dir;if(j<0||j>=a.length)return;let tmp=a[i].priority;a[i].priority=a[j].priority;a[j].priority=tmp;save();activityV4()}
function demoLink(){return 'https://templeshare.org/share/'+encodeURIComponent((data.profile.name||'your-name').toLowerCase().replace(/\s+/g,'-'))+'-DEMO'}
function invitationPanel(mode){
 const link=demoLink();
 const subject='Temple Share — My Family Names';
 const body='I would love your help with some family temple ordinances. This is a prototype link only (not a working invitation):\n'+link;
 const mail='mailto:?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
 const panel=document.getElementById('inviteFeedback');
 if(!panel)return;
 panel.style.display='block';
 panel.innerHTML='<strong>'+(mode==='email'?'Email invitation preview':'Personal invitation link')+'</strong><p class="hint">This is a sample link only. It does not lead to a working website.</p><label for="demoInviteLink">Invitation link</label><input id="demoInviteLink" readonly value="'+esc(link)+'" onclick="this.select()"><div class="actions"><button class="secondary" type="button" onclick="copyDemoLink()">Copy Link</button>'+(mode==='email'?'<a class="btn" href="'+esc(mail)+'">Open Email App</a>':'')+'</div>'+(mode==='email'?'<p class="hint">If your email app does not open, copy the invitation text below into an email:</p><textarea id="demoEmailText" readonly>'+esc('Subject: '+subject+'\n\n'+body)+'</textarea>':'')+'<p id="inviteStatus" role="status" class="hint">You can also select and copy the link manually.</p>';
 if(mode==='email') { const anchor=panel.querySelector('a[href^="mailto:"]'); if(anchor)anchor.focus(); }
}
async function copyDemoLink(){
 invitationPanel('copy');
 const link=demoLink(), status=document.getElementById('inviteStatus');
 try{
   if(!navigator.clipboard || !navigator.clipboard.writeText)throw Error('Clipboard API unavailable');
   await navigator.clipboard.writeText(link);
   if(status)status.textContent='Sample link copied! (Not a live invitation.)';
 }catch(e){
   const input=document.getElementById('demoInviteLink');
   if(input){input.focus();input.select();}
   if(status)status.textContent='Your browser blocked automatic copying. The link is selected; press Command+C (Mac) or Ctrl+C (Windows).';
 }
}
function emailDemoLink(){invitationPanel('email')}
function serveV4(){node(`<button class="secondary back" onclick="back()">← Back</button><h1 class="sectiontitle">I'd Like to Serve</h1><p class="muted">Browse opportunities, search by sharer, or follow a personal invitation.</p><div class="panel" style="margin-bottom:18px"><label>Where would you like to look?</label><select id="vscope" onchange="serveScope=this.value;listV4()"><option value="ward" ${serveScope==='ward'?'selected':''}>My Ward</option><option value="stake" ${serveScope==='stake'?'selected':''}>My Stake (including my ward)</option></select><label>Find names shared by a particular person (optional)</label><input id="vsearch" value="${esc(serveSearch)}" placeholder="Type a sharer's name" oninput="serveSearch=this.value;listV4()"><label>Ordinance type</label><select id="vtype" onchange="serveType=this.value;listV4()"><option value="all">All ordinance types</option>${['Baptism and Confirmation','Initiatory','Endowment','Sealing to Spouse','Sealing to Parents'].map(x=>`<option ${serveType===x?'selected':''}>${x}</option>`).join('')}</select><label>How many names?</label><select id="vquantity" onchange="serveQuantity=Number(this.value)">${[1,2,3,4,5,10].map(n=>`<option value="${n}" ${serveQuantity===n?'selected':''}>${n}</option>`).join('')}</select><p class="hint">Your ward and stake come from your profile. Search results show only opportunities you're allowed to access.</p></div><div id="servlist" class="cards"></div>${intro()}`);listV4()}
function listV4(){let p=data.profile,target=document.getElementById('servlist');if(!target)return;let norm=x=>String(x||'').trim().toLowerCase();let demoNoAffiliation=!norm(p.ward)||!norm(p.stake);let cards=data.cards.filter(c=>{if(c.status!=='available'||c.returnPending)return false;if(serveType!=='all'&&c.ordinance!==serveType)return false;let sameStake=norm(c.stake)===norm(p.stake),sameWard=sameStake&&norm(c.ward)===norm(p.ward);let permitted=demoNoAffiliation ? (!norm(c.ward)&&!norm(c.stake)&&(c.audience==='ward'||c.audience==='stake')) : ((serveScope==='ward'&&sameWard&&(c.audience==='ward'||c.audience==='stake'))||(serveScope==='stake'&&sameStake&&(c.audience==='stake'||(c.audience==='ward'&&sameWard))));if(!permitted)return false;return !serveSearch.trim()||norm(c.owner==='Me'?p.name:c.owner).includes(norm(serveSearch))});cards.sort((a,b)=>a.priority-b.priority);let banner=demoNoAffiliation?'<div class="notice"><strong>Demo preview:</strong> Your profile has no ward or stake, so this page displays only sample opportunities created here without ward or stake information. In the live site, matching ward/stake profiles are required. <a href="#" onclick="event.preventDefault();view(\'profile\')">Set your profile</a>.</div>':'';target.innerHTML=banner+(cards.length?cards.map(c=>`<div class="cardline"><h3>${esc(c.ancestor)}</h3><div class="meta">${esc(c.ordinance)} · ${esc(c.ward||'Demo ward not set')} · ${c.method==='upload'?'Card available after claim':'FamilySearch invitation after claim'}</div>${c.note?`<p>${esc(c.note)}</p>`:''}<div class="actions"><button onclick="claimV4(${c.id})">Claim This Ordinance</button></div><div id="claim-confirm-${c.id}" class="notice" style="display:none;margin-top:12px" aria-live="polite"></div></div>`).join(''):'<div class="panel">No matching available opportunities. Try another ordinance type or sharing area. If these were shared under a different ward or stake, check your profile.</div>')}
function claimV4(id){
 let c=data.cards.find(x=>x.id===id),panel=document.getElementById('claim-confirm-'+id);
 if(!panel)return;
 if(!c||c.status!=='available'){panel.style.display='block';panel.textContent='This ordinance is no longer available.';return;}
 panel.style.display='block';
 panel.innerHTML=`<strong>Claim ${esc(c.ordinance)} for ${esc(c.ancestor)}?</strong><p class="hint">This will reserve the opportunity for you in this demonstration.</p>${c.method==='familysearch'?`<label><input class="check" type="checkbox" id="contactConsent-${id}"> Allow the contributor to see my profile email for this invitation (optional demo consent).</label>`:''}<div class="actions"><button type="button" onclick="confirmClaimV4(${id})">Yes, Claim This Ordinance</button><button type="button" class="secondary" onclick="cancelClaimV4(${id})">Cancel</button></div>`;

}
function serviceV4(){let cards=data.cards.filter(c=>c.status==='claimed'||c.status==='completed');node(`<button class="secondary back" onclick="back()">← Back</button><h1 class="sectiontitle">My Temple Service</h1><p class="muted">Your claimed ordinances and optional completion messages, all in one place.</p><div class="tabs">${[['all','All'],['awaiting','Awaiting Invitation'],['ready','Ready to Perform'],['completed','Completed']].map(([k,l])=>`<button class="mini ${serviceFilter===k?'active':''}" onclick="serviceFilter='${k}';serviceV4()">${l}</button>`).join('')}</div><div class="cards">${cards.filter(c=>serviceFilter==='all'||(serviceFilter==='completed'&&c.status==='completed')||(serviceFilter==='awaiting'&&c.status==='claimed'&&c.method==='familysearch'&&!c.invitationAccepted)||(serviceFilter==='ready'&&c.status==='claimed'&&(c.method==='upload'||c.invitationAccepted))).map(c=>`<div class="cardline"><div class="split"><div><h3>${esc(c.ancestor)}</h3><div class="meta">${esc(c.ordinance)} · ${esc(c.claimedAt||'')} · ${esc(statusName(c))}</div></div><span class="pill">${statusName(c)}</span></div>${c.method==='upload'&&c.status==='claimed'?'<p class="hint">In the live site, your assigned ordinance card will be available securely here. This demo does not store or distribute files.</p>':''}${c.method==='familysearch'&&c.status==='claimed'&&!c.invitationSent?'<p class="hint">Waiting for the contributor to send your FamilySearch invitation.</p>':''}<div class="actions"><button class="secondary" onclick="view('detail',${c.id})">View My Ordinance</button></div></div>`).join('')||'<div class="panel">No ordinances in this category.</div>'}</div>${intro()}`)}
function detailV4(){let contributor=pageHistory.at(-1)?.page==='activity';let c=data.cards.find(x=>x.id===selectedId);if(!c)return view('activity');let msgs=data.messages[c.id]||[];node(`<button class="secondary back" onclick="back()">← Back</button><h1 class="sectiontitle">${esc(c.ancestor)}</h1><div class="grid"><div class="panel"><h2>Ordinance Details</h2><p><strong>Ordinance:</strong> ${esc(c.ordinance)}<br><strong>Sharing:</strong> ${audienceName(c.audience)}<br><strong>Method:</strong> ${c.method==='upload'?'Upload card':'FamilySearch invitation'}<br><strong>Status:</strong> ${statusName(c)}<br><strong>Volunteer:</strong> ${esc(c.volunteer||'Not yet claimed')}</p>${c.status==='available'?`<label>Who may see this opportunity?</label><select onchange="changeAudience(${c.id},this.value)">${['ward','stake','person','family'].map(a=>`<option value="${a}" ${c.audience===a?'selected':''}>${audienceName(a)}</option>`).join('')}</select>`:''}${contributor&&c.status==='claimed'&&c.method==='familysearch'&&!c.invitationSent&&!c.returnPending?`<div class="notice">Contributor: use FamilySearch's Share with Individual to invite the volunteer. Then confirm you've sent the invitation.</div>${c.contactConsent&&c.volunteerEmail?`<p>Volunteer email: ${esc(c.volunteerEmail)}</p>`:'<p class="hint">No consented email available. Coordinate the invitation separately.</p>'}<details><summary>How to send the invitation</summary><ol><li>Open your reserved ordinance in FamilySearch.</li><li>Select Share with Individual.</li><li>Enter the recipient information requested by FamilySearch and send the invitation.</li><li>Return here and confirm it was sent.</li></ol><p class="hint">Follow the current FamilySearch prompts. No actual invitation is sent by this demo.</p></details><button onclick="markInvitation(${c.id})">I've Sent the FamilySearch Invitation</button>`:''}${c.status==='claimed'&&c.method==='upload'?`<div class="notice">Assigned to one volunteer. A real secure card download requires the live server and applicable permission.</div>`:''}${c.status==='claimed'&&c.method==='familysearch'&&!c.invitationAccepted&&!c.returnPending?`<div class="notice">${c.invitationSent?(contributor?'Invitation sent; waiting for volunteer acceptance.':'Accept the invitation in FamilySearch, then confirm here.'):'Waiting for the contributor to send the invitation.'}${!contributor&&c.invitationSent?`<div class="actions"><button onclick="acceptInvitation(${c.id})">I’ve Accepted the Invitation</button></div>`:''}</div>`:''}${c.status==='claimed'&&!contributor?`<p class="hint">Suggested service window: 30 days. Reminders and extensions will be implemented on the live server.</p><div class="actions"><button ${c.returnPending||(c.method==='familysearch'&&!c.invitationAccepted)?'disabled':''} onclick="report(${c.id})">I've Completed This Ordinance</button><button class="secondary" ${c.returnPending?'disabled':''} onclick="requestReturn(${c.id})">Return / Request Release</button></div>`:''}${c.returnPending?`<div class="notice"><strong>Return Requested — Awaiting Review</strong><p>Reassignment is blocked until the FamilySearch/card status is confirmed safe.</p>${contributor?`<button onclick="reviewReturn(${c.id})">Review Return Request</button><div id="returnReview"></div>`:''}</div>`:''}${c.status==='completed'?'<div class="notice success">Completion reported by volunteer; not independently verified by FamilySearch. You may still exchange personal messages.</div>':''}</div><div class="panel"><h2>Circle of Gratitude</h2><p class="muted">Share thanks or a personal experience if you wish. No message is required.</p>${msgs.map(m=>`<div class="message"><strong>${esc(m.author)}${m.role?' · '+esc(m.role):''}</strong>${m.at?`<div class="hint">${esc(new Date(m.at).toLocaleString())}</div>`:''}<div>${esc(m.body)}</div></div>`).join('')||'<p class="hint">No messages yet.</p>'}<form onsubmit="message(event,${c.id})"><label>Optional personal message</label><textarea name="body" placeholder="${contributor?'Thank you for serving my family...':'It was a privilege to serve your family...'}" required></textarea><button>Post Sample Message</button></form><p class="hint">Demo only: messages remain on this device, without real user identities or notifications.</p></div></div>`)}
function changeAudience(id,a){let c=data.cards.find(x=>x.id===id);if(c&&c.status==='available'){c.audience=a;save()}}
function markInvitation(id){let c=data.cards.find(x=>x.id===id);if(!c||c.method!=='familysearch'||c.status!=='claimed'||c.returnPending||pageHistory.at(-1)?.page!=='activity')return;c.invitationSent=true;c.invitationAccepted=false;save();view('detail',id)}
function requestReturn(id){let c=data.cards.find(x=>x.id===id);if(!c||c.status!=='claimed'||c.returnPending||pageHistory.at(-1)?.page==='activity')return;if(!confirm('Request return? This will not automatically reassign the ordinance until its FamilySearch/card status is checked.'))return;c.returnPending=true;save();view('detail',id)}
function report(id){let c=data.cards.find(x=>x.id===id);if(!c||c.status!=='claimed'||pageHistory.at(-1)?.page==='activity')return;if(c.returnPending){alert('This ordinance has a return pending review. Please resolve the return request before reporting completion.');return;}if(c.method==='familysearch'&&!c.invitationAccepted){alert('Confirm acceptance of the FamilySearch invitation first.');return;}if(!confirm('Are you sure this ordinance has been completed? This is a volunteer report, not FamilySearch verification.'))return;c.status='completed';c.reported=true;save();view('detail',id)}

function reviewReturn(id){const c=data.cards.find(x=>x.id===id);if(!c||!c.returnPending||pageHistory.at(-1)?.page!=='activity')return;document.getElementById('returnReview').innerHTML=`<p>Before reassigning, check FamilySearch to confirm the ordinance is incomplete and available for sharing. Confirm any previous invitation or printed card has been safely resolved.</p><label><input class="check" type="checkbox" id="returnSafe"> I have confirmed this ordinance is incomplete and safe to reassign.</label><div class="actions"><button onclick="approveReturn(${id})">Make Available Again</button><button class="secondary" onclick="detailV4()">Keep on Hold</button></div><p id="returnHint" role="alert" style="color:#a33125;font-weight:650"></p>`;}
function approveReturn(id){const c=data.cards.find(x=>x.id===id);if(!c||c.status!=='claimed'||!c.returnPending||pageHistory.at(-1)?.page!=='activity')return;if(!document.getElementById('returnSafe')?.checked){document.getElementById('returnHint').textContent='Please confirm the ordinance is safe to reassign first.';return;}Object.assign(c,{status:'available',returnPending:false,volunteer:'',volunteerEmail:'',claimedAt:'',invitationSent:false,invitationAccepted:false,contactConsent:false,invitationStatus:'',reported:false,verified:false});save();detailV4();}
function acceptInvitation(id){const c=data.cards.find(x=>x.id===id);if(!c||c.status!=='claimed'||c.method!=='familysearch'||!c.invitationSent||c.returnPending||pageHistory.at(-1)?.page==='activity')return;c.invitationAccepted=true;save();detailV4();}
render();
</script></body></html>
