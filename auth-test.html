<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temple Share — Authentication Test</title><style>body{font:17px system-ui;background:#f8f7f2;color:#24384a;margin:0}main{max-width:600px;margin:40px auto;padding:24px}section{background:white;border:1px solid #ddd;border-radius:14px;padding:24px;margin:20px 0}label{display:block;margin:12px 0}input{display:block;box-sizing:border-box;width:100%;padding:12px;border:1px solid #aaa;border-radius:6px;font:inherit}button{background:#3c6477;color:white;border:0;border-radius:7px;padding:12px;margin:5px 5px 5px 0;font:inherit;cursor:pointer}button:disabled{opacity:.5}#status{white-space:pre-wrap;overflow-wrap:anywhere} [hidden]{display:none!important}h1,h2{font-family:Georgia,serif}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main><h1>Temple Share</h1><p>Share a Name. Bless a Family. Turn Hearts.</p><p><strong>Authentication test only.</strong> Use fictional profile information and an email inbox you control. No ordinance information.</p><p><a href="./">Return to existing prototype</a></p><section id="login"><h2>Account access</h2><label>Email<input id="email" type="email" autocomplete="email"></label><label>Password (at least 12 characters)<input id="password" type="password" autocomplete="current-password"></label><button id="signup">Create account</button><button id="signin">Sign in</button><button id="reset">Send password reset email</button></section><section id="profile" hidden><h2>My profile</h2><p id="identity"></p><label>Full name<input id="name"></label><label>Ward<input id="ward"></label><label>Stake<input id="stake"></label><button id="save">Save profile</button><button id="logout">Sign out</button></section><section id="recovery" hidden><h2>Reset password</h2><label>New password<input id="newpass" type="password" autocomplete="new-password"></label><button id="update">Update password</button></section><section><h2>Test status</h2><p id="status" role="status" aria-live="polite">Connecting…</p></section></main><script>
const $=id=>document.getElementById(id), say=s=>$('status').textContent=s;
const redirect='https://jtg9j58497-png.github.io/temple-share/';
const db=supabase.createClient('https://mxlwzrbqsvrujdyonjxb.supabase.co','sb_publishable_B2MU0sVGv-DhJ4MQPtN_0w_uUG4RLj_');
let user=null,recovering=false;
async function run(fn){try{await fn()}catch(e){say(e.message||'Request failed')}}
function check(r){if(r.error)throw r.error;return r.data}
async function show(session){user=session?.user||null;$('login').hidden=!!user;$('profile').hidden=!user||recovering;$('recovery').hidden=!recovering;if(!user){say('Signed out. Ready to test.');return}if(recovering){say('Enter your new password.');return} $('identity').textContent=user.email;const p=check(await db.from('profiles').select('full_name,ward_name,stake_name').eq('id',user.id).single());$('name').value=p.full_name;$('ward').value=p.ward_name;$('stake').value=p.stake_name;say('Signed in. Your profile was loaded from Supabase.');}
const email=()=>$('email').value.trim(), pass=()=>$('password').value;
$('signup').onclick=()=>run(async()=>{if(pass().length<12)throw Error('Use at least 12 characters.');check(await db.auth.signUp({email:email(),password:pass(),options:{emailRedirectTo:redirect+'auth-test.html'}}));say('Registration requested. Check your email for a confirmation link.');});
$('signin').onclick=()=>run(async()=>{const d=check(await db.auth.signInWithPassword({email:email(),password:pass()}));$('password').value='';await show(d.session)});
$('reset').onclick=()=>run(async()=>{check(await db.auth.resetPasswordForEmail(email(),{redirectTo:redirect+'auth-test.html'}));say('Password reset requested. Check your inbox.');});
$('save').onclick=()=>run(async()=>{if(!user)throw Error('Sign in first.');check(await db.from('profiles').update({full_name:$('name').value,ward_name:$('ward').value,stake_name:$('stake').value}).eq('id',user.id).select('id').single());say('Profile saved.');});
$('logout').onclick=()=>run(async()=>{check(await db.auth.signOut());recovering=false;await show(null)});
$('update').onclick=()=>run(async()=>{if($('newpass').value.length<12)throw Error('Use at least 12 characters.');check(await db.auth.updateUser({password:$('newpass').value}));$('newpass').value='';recovering=false;await show(check(await db.auth.getSession()).session);say('Password updated.');});
db.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY')recovering=true;setTimeout(()=>run(()=>show(session)),0)});
</script></body></html>
